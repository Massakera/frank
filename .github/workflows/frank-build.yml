name: Build Frank

on:
  workflow_dispatch:
  push:
    branches:
      - frank

permissions:
  contents: read

concurrency:
  group: frank-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      STABLE_GIT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --config imports_granularity=Item --check
      - name: Test role routing
        run: cargo test -p codex-core agent::role
      - name: Build release
        run: cargo build --release -p codex-cli --bin codex
      - name: Stage Frank
        run: |
          install -Dm755 target/release/codex dist/frank
          cd dist
          sha256sum frank > frank.sha256
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: frank-linux-x86_64-${{ github.sha }}
          path: |
            codex-rs/dist/frank
            codex-rs/dist/frank.sha256
          if-no-files-found: error
          retention-days: 7
