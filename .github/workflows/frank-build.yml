name: Build Frank

on:
  workflow_dispatch:
  push:
    branches:
      - frank

permissions:
  contents: read

concurrency:
  group: frank-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      STABLE_GIT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --config imports_granularity=Item --check
      - name: Test role routing
        run: cargo test --profile dev-small -p codex-core agent::role
      - name: Build Frank
        run: |
          cargo build --profile dev-small -p codex-cli --bin codex
          cargo build --profile dev-small -p codex-code-mode-host --bin codex-code-mode-host
      - name: Stage Frank
        run: |
          install -Dm755 target/dev-small/codex dist/frank
          install -Dm755 target/dev-small/codex-code-mode-host dist/codex-code-mode-host
          cd dist
          sha256sum frank codex-code-mode-host > frank.sha256
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: frank-linux-x86_64-${{ github.sha }}
          path: |
            codex-rs/dist/frank
            codex-rs/dist/codex-code-mode-host
            codex-rs/dist/frank.sha256
          if-no-files-found: error
          retention-days: 7
